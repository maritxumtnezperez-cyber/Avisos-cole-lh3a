<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#39aa6a">
  <link rel="stylesheet" href="/styles.css">
  <title>Acceso Privado · LH3A</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f6f5;
    }
    .login-card {
      background: white;
      padding: 30px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 360px;
      width: 90%;
      text-align: center;
    }
    .login-card img {
      width: 80px;
      height: 80px;
      margin-bottom: 12px;
    }
    .login-card h2 {
      margin: 0 0 6px 0;
      color: #1a2f23;
    }
    .login-card p {
      color: #59645e;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .login-card input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 14px;
      text-align: center;
    }
    .login-card button {
      width: 100%;
      padding: 12px;
      background: #39aa6a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .login-card button:active {
      background: #209b59;
    }
    .error-msg {
      color: #ef4444;
      font-size: 13px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <img src="/logo.jpg" alt="LH3A Logo">
    <h2>Avisos Cole LH3A</h2>
    <p>Introduce la contraseña para acceder</p>
    <form id="loginForm">
      <input type="password" id="passInput" placeholder="Contraseña de acceso" required autofocus>
      <button type="submit">Entrar</button>
    </form>
    <div id="errMsg" class="error-msg"></div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pass = document.getElementById("passInput").value;
      const errMsg = document.getElementById("errMsg");

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: pass })
        });

        if (res.ok) {
          sessionStorage.setItem("appPassword", pass);
          window.location.href = "/";
        } else {
          errMsg.textContent = "Contraseña incorrecta";
        }
      } catch (err) {
        errMsg.textContent = "Error al conectar con el servidor";
      }
    });
  </script>
</body>
</html>
