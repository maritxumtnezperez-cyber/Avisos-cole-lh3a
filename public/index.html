<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agenda Escolar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABECERA -->
  <header>
    <h1>Agenda Escolar</h1>
    <button id="adminBtn" class="icon-btn" title="Administración">⚙️</button>
  </header>

  <main>
    <!-- PANTALLA: INICIO / EVENTOS PRÓXIMOS -->
    <section id="home" class="screen active">
      <div id="next" class="next-card"></div>
      
      <div class="section-title">
        <h2>Próximos eventos</h2>
      </div>
      
      <div id="noticeList" class="notice-list"></div>
    </section>

    <!-- PANTALLA: EVENTOS PASADOS -->
    <section id="past" class="screen">
      <div class="section-title">
        <h2>Eventos pasados</h2>
      </div>
      
      <div id="pastNoticeList" class="notice-list"></div>
    </section>

    <!-- PANTALLA: CALENDARIO -->
    <section id="calendar" class="screen">
      <div class="section-title">
        <h2>Calendario escolar</h2>
      </div>
      
      <div class="calendar-head">
        <button id="prevMonth">❮</button>
        <span id="monthLabel"></span>
        <button id="nextMonth">❯</button>
      </div>
      
      <div id="calendarGrid" class="calendar-grid"></div>

      <!-- LISTA DE EVENTOS DEL MES SELECCIONADO -->
      <div class="section-title" style="margin-top: 24px;">
        <h2>Eventos de este mes</h2>
      </div>
      <div id="monthEventsList" class="notice-list"></div>
    </section>

    <!-- PANTALLA: ADMINISTRACIÓN / CREAR EVENTO -->
    <section id="admin" class="screen">
      <div class="admin-header">
        <button id="backBtn" class="btn-action">← Volver</button>
        <h2>Publicar nuevo evento</h2>
      </div>

      <div class="form-group">
        <label for="title">Título del evento *</label>
        <input type="text" id="title" placeholder="Ej. Excursión al museo" required>
      </div>

      <div class="form-group">
        <label for="date">Fecha</label>
        <input type="date" id="date">
      </div>

      <div class="form-group">
        <label for="time">Hora</label>
        <input type="time" id="time">
      </div>

      <div class="form-group">
        <label for="description">Descripción</label>
        <textarea id="description" rows="4" placeholder="Detalles del evento..."></textarea>
      </div>

      <div class="form-group">
        <label for="imageFile">Imagen (Opcional)</label>
        <input type="file" id="imageFile" accept="image/*">
      </div>

      <button id="publish" class="btn-action btn-publish">Publicar Evento</button>
      <p id="adminMsg" class="admin-msg"></p>
    </section>
  </main>

  <!-- NAVEGACIÓN INFERIOR -->
  <nav class="bottom">
    <button data-screen="home" class="active">
      <span class="nav-icon">📌</span>
      <span class="nav-label">Próximos</span>
    </button>
    <button data-screen="past">
      <span class="nav-icon"><⏳️/span>
      <span class="nav-label">Pasados</span>
    </button>
    <button data-screen="calendar">
      <span class="nav-icon">🗓</span>
      <span class="nav-label">Calendario</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
