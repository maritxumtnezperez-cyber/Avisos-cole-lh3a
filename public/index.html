<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2fa866">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/styles.css">
  <title>Avisos Cole · LH3A</title>
</head>
<body>
  <header class="top">
    <img src="/logo.png" class="logo" alt="LH3A">
    <div><h1>Avisos Cole</h1><p>LH3A</p></div>
    <button id="installBtn" class="icon" hidden>＋</button>
  </header>

  <main>
    <section id="home" class="screen active">
      <button id="adminBtn" class="admin-link">⚙ Publicar evento</button>
      <div id="next" class="next-card"></div>
      <div class="section-title"><h2>Próximos eventos</h2></div>
      <div id="noticeList"></div>
    </section>

    <section id="calendar" class="screen">
      <div class="section-title"><h2>Calendario</h2></div>
      <div class="calendar-head">
        <button id="prevMonth">‹</button><strong id="monthLabel"></strong><button id="nextMonth">›</button>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
      <div id="eventList"></div>
    </section>

    <section id="reminders" class="screen">
      <div class="section-title"><h2>Notificaciones</h2></div>
      <p style="margin-bottom: 15px; color: #555;">Activa las notificaciones para recibir alertas programadas de los eventos en tu dispositivo.</p>
      <button id="notifyBtn" class="primary">🔔 Activar notificaciones push</button>
    </section>

    <section id="admin" class="screen">
      <div class="section-title"><button id="backBtn">‹</button><h2>Nuevo evento</h2></div>
      <div class="form">
        <label>Título<input id="title" placeholder="Ej. Excursión al museo"></label>
        <label>Descripción<textarea id="description" placeholder="Escribe los detalles..."></textarea></label>
        <div class="two">
          <label>Fecha<input id="date" type="date"></label>
          <label>Hora<input id="time" type="time"></label>
        </div>
        
        <label>Imagen adjunta (opcional)
          <input id="imageFile" type="file" accept="image/*">
        </label>

        <label class="switchrow">
          <span>🔔 Recordatorio 24h antes</span>
          <input id="reminder24h" type="checkbox">
        </label>

        <label class="switchrow">
          <span>⏰ Recordatorio día del evento (07:30 AM)</span>
          <input id="reminderSameDay" type="checkbox">
        </label>

        <button id="publish" class="primary">Publicar evento</button>
        <p id="adminMsg" class="msg"></p>
      </div>
    </section>
  </main>

  <nav class="bottom">
    <button data-screen="home" class="active">⌂<span>Inicio</span></button>
    <button data-screen="calendar">▦<span>Calendario</span></button>
    <button data-screen="reminders">♧<span>Avisos</span></button>
  </nav>
  <script src="/app.js"></script>
</body>
</html>
