<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#39aa6a">
  <meta name="apple-mobile-web-app-title" content="Cosas de Ane">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Cosas de Ane</title>
  
  <!-- Favicon e Iconos PWA -->
  <link rel="icon" type="image/png" href="/Logo.png">
  <link rel="shortcut icon" href="/Logo.png">
  <link rel="apple-touch-icon" href="/Logo.png">
  <link rel="manifest" href="/manifest.json">

  <link rel="stylesheet" href="/styles.css">

  <!-- Estilos embebidos de seguridad para garantizar la maqueta -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f5;
      color: #333;
      padding-bottom: 70px;
    }

    /* Encabezado */
    .app-header {
      background-color: #39aa6a;
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .header-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .app-logo {
      width: 42px !important;
      height: 42px !important;
      max-width: 42px !important;
      max-height: 42px !important;
      border-radius: 50%;
      object-fit: cover;
      background: white;
    }
    .app-header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: bold;
    }
    .header-subtitle {
      font-size: 12px;
      opacity: 0.85;
      display: block;
    }
    .btn-icon {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }

    /* Contenedor y Pantallas */
    .app-container {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }
    .screen {
      display: none;
    }
    .screen.active {
      display: block;
    }

    /* Formulario y Filtros */
    .filter-container, .form-group {
      margin-bottom: 14px;
    }
    .filter-container select, .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      margin-top: 4px;
    }
    .form-row {
      display: flex;
      gap: 10px;
    }
    .form-row .form-group {
      flex: 1;
    }

    /* Botones */
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #39aa6a;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    .btn-secondary {
      background: #e2e8f0;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 12px;
    }

    /* Navegación Inferior */
    nav.bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: white;
      display: flex;
      border-top: 1px solid #e5e7eb;
      z-index: 100;
    }
    nav.bottom button {
      flex: 1;
      border: none;
      background: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      font-size: 11px;
      cursor: pointer;
    }
    nav.bottom button.active {
      color: #39aa6a;
      font-weight: bold;
    }
    nav.bottom button span {
      font-size: 18px;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <!-- Encabezado -->
  <header class="app-header">
    <div class="header-content">
      <img src="/Logo.png" alt="Logo" class="app-logo">
      <div>
        <h1>Cosas de Ane</h1>
        <span class="header-subtitle">LH3A</span>
      </div>
    </div>
    <button id="adminBtn" class="btn-icon">⚙️</button>
  </header>

  <main class="app-container">
    <!-- Pantalla: Próximos Eventos -->
    <section id="home" class="screen active">
      <div id="next" class="next-event-card"></div>

      <div class="filter-container">
        <label for="filterCategory">Filtrar por categoría:</label>
        <select id="filterCategory">
          <option value="TODAS">Todas las categorías</option>
          <option value="Reunión 📝">Reunión 📝</option>
          <option value="Excursión 🚌">Excursión 🚌</option>
          <option value="Médico 🏥">Médico 🏥</option>
          <option value="Jiujitsu 🥋">Jiujitsu 🥋</option>
          <option value="General 📌">General 📌</option>
        </select>
      </div>

      <div id="noticeList" class="notice-list"></div>
    </section>

    <!-- Pantalla: Pasados -->
    <section id="past" class="screen">
      <h2>Eventos pasados</h2>
      <div id="pastNoticeList" class="notice-list"></div>
    </section>

    <!-- Pantalla: Calendario -->
    <section id="calendar" class="screen">
      <div class="calendar-header">
        <button id="prevMonth" class="btn-calendar">&lt;</button>
        <h2 id="monthLabel"></h2>
        <button id="nextMonth" class="btn-calendar">&gt;</button>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
      <div id="monthEventsList" class="notice-list" style="margin-top: 20px;"></div>
    </section>

    <!-- Pantalla: Horarios -->
    <section id="schedules" class="screen">
      <h2>Horarios</h2>
      <div id="schedulesContent">
        <p class="empty-msg">Consulta los horarios habituales de actividades.</p>
      </div>
    </section>

    <!-- Pantalla: Administración / Publicar -->
    <section id="admin" class="screen">
      <button id="backBtn" class="btn-secondary">← Volver</button>
      <h2>Publicar nuevo evento</h2>

      <div class="form-group">
        <label for="title">Título del evento *</label>
        <input type="text" id="title" placeholder="Ej. Salida al teatro">
      </div>

      <div class="form-group">
        <label for="category">Categoría *</label>
        <select id="category">
          <option value="Reunión 📝">Reunión 📝</option>
          <option value="Excursión 🚌">Excursión 🚌</option>
          <option value="Médico 🏥">Médico 🏥</option>
          <option value="Jiujitsu 🥋">Jiujitsu 🥋</option>
          <option value="General 📌">General 📌</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="date">Fecha</label>
          <input type="date" id="date">
        </div>
        <div class="form-group">
          <label for="time">Hora</label>
          <input type="time" id="time">
        </div>
      </div>

      <div class="form-group">
        <label for="description">Detalles</label>
        <textarea id="description" rows="3" placeholder="Detalles del evento..."></textarea>
      </div>

      <div class="form-group">
        <label for="imageFile">Imagen (Opcional)</label>
        <input type="file" id="imageFile" accept="image/*">
      </div>

      <button id="publish" class="btn-primary">Publicar Evento</button>
    </section>
  </main>

  <!-- Navegación Inferior (4 Pestañas) -->
  <nav class="bottom">
    <button data-screen="home" class="active">
      <span>📌</span>
      <label>Próximos</label>
    </button>
    <button data-screen="past">
      <span>⌛</span>
      <label>Pasados</label>
    </button>
    <button data-screen="calendar">
      <span>📅</span>
      <label>Calendario</label>
    </button>
    <button data-screen="schedules">
      <span>🕒</span>
      <label>Horarios</label>
    </button>
  </nav>

  <script src="/app.js"></script>
</body>
</html>
