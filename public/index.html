<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#39aa6a">
  <meta name="apple-mobile-web-app-title" content="Cosas de Ane">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Cosas de Ane</title>
  
  <!-- Favicon e Iconos PWA -->
  <link rel="icon" type="image/png" href="/Logo.png">
  <link rel="shortcut icon" href="/Logo.png">
  <link rel="apple-touch-icon" href="/Logo.png">
  <link rel="manifest" href="/manifest.json">

  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <!-- Encabezado -->
  <header class="app-header">
    <div class="header-content">
      <img src="/Logo.png" alt="Logo" class="app-logo">
      <div>
        <h1>Cosas de Ane</h1>
        <span class="header-subtitle"> </span>
      </div>
    </div>
    <button id="adminBtn" class="btn-icon">⚙️</button>
  </header>

  <main class="app-container">
    <!-- Pantalla: Próximos Eventos -->
    <section id="home" class="screen active">
      <div id="next" class="next-event-card"></div>

      <div class="filter-container">
        <label for="filterCategory">Filtrar por categoría:</label>
        <select id="filterCategory">
          <option value="TODAS">Todas las categorías</option>
          <option value="Reunión 📝">Reunión 📝</option>
          <option value="Excursión 🚌">Excursión 🚌</option>
          <option value="Médico 🏥">Médico 🏥</option>
          <option value="Jiujitsu 🥋">Jiujitsu 🥋</option>
          <option value="General 📌">General 📌</option>
        </select>
      </div>

      <div id="noticeList" class="notice-list"></div>
    </section>

    <!-- Pantalla: Pasados -->
    <section id="past" class="screen">
      <h2>Eventos pasados</h2>
      <div id="pastNoticeList" class="notice-list"></div>
    </section>

    <!-- Pantalla: Calendario -->
    <section id="calendar" class="screen">
      <div class="calendar-header">
        <button id="prevMonth" class="btn-calendar">&lt;</button>
        <h2 id="monthLabel"></h2>
        <button id="nextMonth" class="btn-calendar">&gt;</button>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
      <div id="monthEventsList" class="notice-list" style="margin-top: 20px;"></div>
    </section>

    <!-- Pantalla: Horarios -->
    <section id="schedules" class="screen">
      <h2>Horarios</h2>
      <div id="schedulesContent">
        <p class="empty-msg">Consulta los horarios habituales de actividades.</p>
      </div>
    </section>

    <!-- Pantalla: Administración / Publicar -->
    <section id="admin" class="screen">
      <button id="backBtn" class="btn-secondary">← Volver</button>
      <h2>Publicar nuevo evento</h2>

      <div class="form-group">
        <label for="title">Título del evento *</label>
        <input type="text" id="title" placeholder="Ej. Salida al teatro">
      </div>

      <div class="form-group">
        <label for="category">Categoría *</label>
        <select id="category">
          <option value="Reunión 📝">Reunión 📝</option>
          <option value="Excursión 🚌">Excursión 🚌</option>
          <option value="Médico 🏥">Médico 🏥</option>
          <option value="Jiujitsu 🥋">Jiujitsu 🥋</option>
          <option value="General 📌">General 📌</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="date">Fecha</label>
          <input type="date" id="date">
        </div>
        <div class="form-group">
          <label for="time">Hora</label>
          <input type="time" id="time">
        </div>
      </div>

      <div class="form-group">
        <label for="description">Detalles</label>
        <textarea id="description" rows="3" placeholder="Detalles del evento..."></textarea>
      </div>

      <div class="form-group">
        <label for="imageFile">Imagen (Opcional)</label>
        <input type="file" id="imageFile" accept="image/*">
      </div>

      <button id="publish" class="btn-primary">Publicar Evento</button>
    </section>
  </main>

  <!-- Navegación Inferior (4 Pestañas) -->
  <nav class="bottom">
    <button data-screen="home" class="active">
      <span>📌</span>
      <label>Próximos</label>
    </button>
    <button data-screen="past">
      <span>⌛</span>
      <label>Pasados</label>
    </button>
    <button data-screen="calendar">
      <span>📅</span>
      <label>Calendario</label>
    </button>
    <button data-screen="schedules">
      <span>🕒</span>
      <label>Horarios</label>
    </button>
  </nav>

  <script src="/app.js"></script>
</body>
</html>
