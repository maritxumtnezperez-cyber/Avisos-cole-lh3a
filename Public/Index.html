<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#39aa6a">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
  <title>Avisos Cole · LH3A</title>
</head>

<body>

<header>
  <img src="/logo.png" alt="LH3A">
  <div>
    <h1>Avisos Cole</h1>
    <small>LH3A</small>
  </div>
</header>

<main>

  <button id="admin">
    ⚙ Publicar aviso
  </button>

  <section id="next"></section>

  <h2>📢 Avisos recientes</h2>
  <div id="list"></div>

  <hr>

  <h2>📅 Calendario</h2>
  <div id="calendar">
    Próximamente
  </div>

  <hr>

  <h2>🔔 Recordatorios</h2>
  <div id="reminders"></div>

  <button id="notify">
    🔔 Activar notificaciones
  </button>

  <section id="panel" hidden>

    <h2>Nuevo aviso</h2>

    <input
      id="title"
      placeholder="Título del aviso"
    >

    <textarea
      id="desc"
      placeholder="Escribe el aviso..."
    ></textarea>

    <input
      id="date"
      type="date"
    >

    <input
      id="time"
      type="time"
    >

    <label>
      <input
        id="important"
        type="checkbox"
      >
      Aviso importante
    </label>

    <button id="publish">
      Publicar aviso
    </button>

  </section>

</main>

<script src="/app.js"></script>

</body>
</html>
